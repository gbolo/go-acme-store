log:
  level: INFO

server:
  bind_address: 127.0.0.1
  bind_port: 15872

acme:
  # ACME directory server to use
  directory: "https://acme-staging-v02.api.letsencrypt.org/directory" # staging
  # directory: "https://acme-v02.api.letsencrypt.org/directory" # prod

  # ACME account to use (private key will get created if it does not exist)
  account_email: acme-store@devnull

  # (optional) DNS server to use for validating dns challenge (overrides the system dns)
  # NOTE: it's a good idea to use an external DNS server to validate the dns challenge
  #       since your local network may be overriding the public zone for your domain(s)
  dns_server: 8.8.8.8:53
  
  # DNS provider: "digitalocean", "acmedns", or "powerdns"
  dns_provider: digitalocean
  
  # Skip TLS verification for ACME directory server (for testing with Pebble)
  # Set to true for development/testing only - NEVER use in production
  tls_insecure_skip_verify: false
  
  # DigitalOcean DNS provider settings
  ## you should set this via env var instead: export ACMESTORE_ACME_DIGITALOCEAN_TOKEN="dop_xxx"
  # digitalocean_token: dop_xxx
  
  # ACME-DNS provider settings
  # Uncomment to use acme-dns for DNS-01 challenges
  #acmedns_server_url: "http://localhost:8053"
  #acmedns_storage: "./acme-dns-accounts.json"
  
  # PowerDNS provider settings
  # Uncomment to use PowerDNS for DNS-01 challenges
  ## you should set these via env vars: export POWERDNS_API_TOKEN="your-token"
  #powerdns_server_url: "https://pdns.example.com"
  #powerdns_api_token: "your-api-token"
  #powerdns_server_id: "localhost"  # Default server ID

vault:
  address: "http://127.0.0.1:8200"
  # path where a KV (v2) secrets engine kv (v2) is mounted on
  kv2_mount: kv
  # path (relative to mount) where we want to store our secrets
  kv2_secret_path: platform/acme
  # skip TLS certificate verification (useful for self-signed certs in dev/test)
  tls_skip_verify: false
  ## you should set this via env var instead: VAULT_TOKEN
  # token: xxx

# Fetcher configuration (for acme-store-fetcher)
# These can be overridden with command-line flags
fetcher:
  # Directory to save certificate files
  output_dir: "./certs"
  # Path to write Traefik configuration file (optional)
  # traefik_config: "/etc/traefik/dynamic/acme-certs.yml"

