[general]
# DNS interface
listen = "0.0.0.0:53533"
# protocol, "both", "both4", "both6", "udp", "udp4", "udp6" or "tcp", "tcp4", "tcp6"
protocol = "both"
# domain name to serve the requests off of
domain = "acme-test.org"
# zone name server
nsname = "acme-test.org"
# admin email address, where @ is substituted with .
nsadmin = "admin.acme-test.org"
# predefined records served in addition to the TXT
records = [
    # domain pointing to the public IP of your acme-dns server 
    "acme-test.org. A 172.28.0.4",
    # specify that acme-test.org will resolve any *.acme-test.org records
    "acme-test.org. NS acme-test.org.",
]
# Debug messages from CORS etc.
debug = true

[database]
# Database engine to use, sqlite3 or postgres
engine = "sqlite3"
# Connection string, filename for sqlite3 and postgres://$username:$password@$host/$db_name for postgres
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
# Listen IP + port
api_domain = ""
ip = "0.0.0.0"
port = "80"
# Disable registration
disable_registration = false
# Listen TLS port
tls = "none"
# CORS settings
cors_origins = ["*"]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
# Log level: "error", "warning", "info" or "debug"
loglevel = "debug"
# Possible values: stdout, TODO file
logtype = "stdout"
# File path for logfile
logfile = "/var/log/acme-dns/acme-dns.log"
# Format, either "json" or "text"
format = "text"

