api=yes
api-key=secret

server-id=localhost

# DNS port to listen on
local-address=0.0.0.0:53533

# SOA configuration
# default-soa-content=ns.@ hostmaster.@ 0 10800 3600 604800 3600

webserver=yes
webserver-address=0.0.0.0
webserver-port=8053
webserver-allow-from=0.0.0.0/0

log-dns-queries=yes
log-dns-details=yes
loglevel=5